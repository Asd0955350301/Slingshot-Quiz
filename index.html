<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一堂課 空污無國界：臺灣空氣品質現況課後測驗</title>
<style>
/* ===== 設計代幣 ===== */
:root{
  --sky-top:#8fcdf0; --sky-bottom:#d9f0fb;
  --grass:#5ba24b; --grass-dark:#3f7f36;
  --wood:#8a5a2b; --wood-dark:#5e3a18;
  --stone:#3c4046;
  --paper:#ffffff; --ink:#1d2b36; --ink-soft:#4a5b68;
  --heart:#d93a3a; --focus:#1553c7; --error:#b3261e;
  --radius:18px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font); color:var(--ink);
  background:linear-gradient(var(--sky-top),var(--sky-bottom) 70%);
  position:fixed;inset:0;width:100%;
}

/* ===== 背景：雲、草地 ===== */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:140px;height:38px;top:12%;left:8%}
.cloud.c1::before{width:60px;height:60px;top:-28px;left:22px}
.cloud.c1::after{width:46px;height:46px;top:-18px;left:70px}
.cloud.c2{width:110px;height:30px;top:24%;right:10%}
.cloud.c2::before{width:48px;height:48px;top:-22px;left:16px}
.cloud.c2::after{width:36px;height:36px;top:-14px;left:56px}
.hill{position:absolute;left:-10%;right:-10%;bottom:0;height:26vh;background:var(--grass);border-radius:50% 50% 0 0/100% 100% 0 0}
.hill.back{height:32vh;left:20%;right:-30%;background:var(--grass-dark)}

/* ===== 版面 ===== */
#app{
  position:relative;z-index:1;width:100%;height:var(--app-height,100dvh);min-height:0;
  display:grid;place-items:center;padding:clamp(8px,2vh,20px) clamp(10px,2vw,16px);
  overflow:hidden;
}
.screen{transform:scale(var(--screen-scale,1));transform-origin:center center}
.card{
  width:min(100%,520px); background:var(--paper);
  border-radius:var(--radius); padding:28px 26px 26px;
  box-shadow:0 10px 0 rgba(63,127,54,.35), 0 18px 40px rgba(20,60,90,.18);
}
.screen[hidden]{display:none}

/* ===== 標題＋彈弓 ===== */
.hero{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.hero svg{flex:none;width:76px;height:auto}
h1{margin:0;font-size:clamp(1.15rem,4.6vw,1.55rem);line-height:1.35;font-weight:800;letter-spacing:.02em}
.sub{margin:4px 0 0;color:var(--ink-soft);font-size:.95rem}

/* ===== 表單 ===== */
fieldset{border:0;margin:0 0 20px;padding:0;min-width:0}
legend,label.field-label{display:block;padding:0;margin-bottom:8px;font-weight:700;font-size:1rem}
input[type=text]{
  width:100%;min-height:52px;padding:10px 14px;font:inherit;font-size:1.1rem;
  border:2px solid #9bb0bf;border-radius:12px;background:#fff;color:var(--ink);
}
input[type=text][aria-invalid=true]{border-color:var(--error)}
.error{min-height:1.4em;margin:6px 2px 0;color:var(--error);font-size:.92rem;font-weight:600}

/* 語言選擇：三顆大按鈕 */
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lang{position:relative}
.lang input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.lang span{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:64px;padding:8px 6px;border:2px solid #9bb0bf;border-radius:12px;
  background:#f3f8fb;font-weight:700;font-size:1.02rem;text-align:center;
}
.lang span small{font-weight:500;font-size:.74rem;color:var(--ink-soft)}
.lang input:checked + span{background:var(--wood);border-color:var(--wood-dark);color:#fff;box-shadow:0 3px 0 var(--wood-dark)}
.lang input:checked + span small{color:#f3e2cf}
.lang input:checked + span::after{content:"✓";font-size:.8rem}

/* 按鈕 */
.btn{
  width:100%;min-height:54px;padding:12px 18px;font:inherit;font-size:1.1rem;font-weight:800;
  color:#fff;background:var(--grass-dark);border:0;border-radius:14px;cursor:pointer;
  box-shadow:0 4px 0 #2b5d25;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b5d25}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #9bb0bf;box-shadow:none;margin-top:10px}

:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* 介紹頁 */
.intro-list{margin:0 0 20px;padding:0;list-style:none;display:grid;gap:10px}
.intro-list li{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.intro-list .ico{flex:none;width:2rem;text-align:center;font-size:1.3rem}
.hearts{display:inline-flex;gap:3px;color:var(--heart)}
.welcome{margin:0 0 14px;font-size:1.25rem;font-weight:800;overflow-wrap:anywhere}
.placeholder{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:#eef6fb;color:var(--ink-soft);font-size:.92rem}

/* ===== 遊戲畫面 ===== */
.card.wide{width:min(100%,980px);padding:14px}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:10px}
#hearts{font-size:1.5rem;color:var(--heart);letter-spacing:2px}
#question{margin:0 0 10px;padding:12px 14px;background:#eef6fb;border-radius:12px;font-size:1.1rem;font-weight:700;line-height:1.45}
#game-canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:12px;background:#9fd6f2}
#feedback{min-height:3.4em;margin:10px 0 6px;font-weight:700;line-height:1.5}
#save-status{min-height:1.35em;margin:0 2px 7px;color:var(--ink-soft);font-size:.82rem;font-weight:700}
#save-status[data-state="error"]{color:var(--error)}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.alts button{min-height:48px;padding:8px 12px;font:inherit;font-weight:700;text-align:left;border:2px solid #9bb0bf;border-radius:12px;background:#f3f8fb;color:var(--ink);cursor:pointer}
.alts button:disabled{opacity:.5;cursor:default}
#next-btn{margin:6px 0 10px}
#next-btn[hidden]{display:block;visibility:hidden;pointer-events:none}
.sub.small{margin:10px 0 8px;font-size:.88rem}
#damage-overlay{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;box-shadow:inset 0 0 0 12px rgba(235,0,0,.95),inset 0 0 150px 70px rgba(255,0,0,.8)}
#damage-overlay.is-active{animation:damage-pulse 650ms ease-out}
#game-screen.is-hit{animation:hit-shake 400ms}
@keyframes hit-shake{
  0%,100%{transform:scale(var(--screen-scale,1))}
  20%{transform:scale(var(--screen-scale,1)) translate(-8px,2px)}
  40%{transform:scale(var(--screen-scale,1)) translate(7px,-2px)}
  60%{transform:scale(var(--screen-scale,1)) translate(-5px,1px)}
  80%{transform:scale(var(--screen-scale,1)) translate(3px,0)}
}
@keyframes damage-pulse{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#damage-overlay.is-active{animation:none;opacity:1}#game-screen.is-hit{animation:none}}
@media (prefers-reduced-motion:no-preference){
  .btn{transition:transform .08s,box-shadow .08s}
  .lang span{transition:background .15s,border-color .15s}
}
@media (max-width:380px){
  .card{padding:22px 16px}
  .hero svg{width:60px}
  .lang span{font-size:.95rem}
}

/* ===== 像素風覆寫 ===== */
:root{--navy:#1a1a2e}
body{background:#1e4fa8}
.scene{background-size:cover;background-position:center bottom;image-rendering:pixelated}
.cloud,.hill{display:none}
.card{border:4px solid var(--navy);border-radius:6px;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--navy),0 12px 0 8px rgba(26,26,46,.55)}
h1{text-shadow:3px 3px 0 #bcd9f7;font-weight:900}
input[type=text]{border:3px solid var(--navy);border-radius:4px;box-shadow:inset 0 3px 0 rgba(26,26,46,.18)}
.btn{color:var(--navy);background:#5cc13a;border:3px solid var(--navy);border-radius:6px;font-weight:900;
  box-shadow:inset 0 -6px 0 #3c9a26,inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 #3c9a26,inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 var(--navy)}
.btn.ghost{background:#ffd23f;border:3px solid var(--navy);color:var(--navy);box-shadow:inset 0 -6px 0 #d9a91c,inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--navy)}
.lang span{border:3px solid var(--navy);border-radius:6px;background:#fff;box-shadow:0 3px 0 var(--navy)}
.lang input:checked + span{background:#4aa3f0;border-color:var(--navy);color:var(--navy);box-shadow:inset 0 -5px 0 #2b7fd0,0 3px 0 var(--navy)}
.lang input:checked + span small{color:var(--navy)}
#question{background:#10142a;color:#fff;border:3px solid #fff;border-radius:4px;outline:3px solid #10142a}
.hud{background:#10142a;color:#fff;border:3px solid #fff;outline:3px solid #10142a;border-radius:4px;padding:8px 12px}
#hearts{display:inline-flex;gap:4px;line-height:0}
#game-canvas{border:3px solid var(--navy);border-radius:4px;image-rendering:pixelated}
.alts button{background:#4aa3f0;border:3px solid var(--navy);border-radius:6px;color:var(--navy);font-weight:900;
  box-shadow:inset 0 -5px 0 #2b7fd0,0 3px 0 var(--navy)}
.alts button:disabled{opacity:.55}

/* ===== 單一視窗適配：手機與電腦都不需要上下捲動 ===== */
@supports not (height:100dvh){#app{height:100%}}
@media (max-height:720px){
  .card{padding:18px 20px 17px}
  .hero{gap:12px;margin-bottom:14px}
  .hero svg{width:62px}
  fieldset{margin-bottom:13px}
  input[type=text]{min-height:46px;padding:7px 12px}
  .lang span{min-height:54px;padding:5px 4px}
  .intro-list{margin-bottom:13px;gap:6px}
  .intro-list li{line-height:1.35}
  .btn{min-height:48px;padding:8px 14px}
  .card.wide{padding:10px}
  .hud{margin-bottom:7px;padding:6px 9px}
  #question{margin-bottom:7px;padding:8px 10px;line-height:1.3}
  #feedback{min-height:2.8em;margin:7px 0 4px;line-height:1.35}
  #save-status{margin-bottom:4px}
  #next-btn{margin:4px 0 6px}
}
@media (max-width:600px){
  .card{width:min(100%,480px)}
  .card.wide{width:100%}
  .hud{gap:3px 9px;font-size:.78rem}
  #hearts{font-size:1.15rem;letter-spacing:1px}
  #hearts svg{width:23px;height:auto}
  #question{font-size:.9rem}
  #feedback{font-size:.86rem}
  #save-status{font-size:.72rem}
  #next-btn{font-size:1rem}
}
@media (orientation:landscape) and (max-height:560px){
  .card:not(.wide){width:min(92vw,760px)}
  .intro-list{grid-template-columns:1fr 1fr;column-gap:18px}
  .intro-list li:last-child{grid-column:1/-1}
}
</style>
</head>

      <svg viewBox="0 0 76 92" aria-hidden="true">
        <!-- 彈弓 -->

        <circle cx="29" cy="39" r="3" fill="#6b7280"/>

        <p class="sub" data-i18n="subtitle"></p>
      </div>

      <fieldset>
        <label class="field-label" for="player-name" data-i18n="nameLabel"></label>

               aria-describedby="name-error" data-i18n-attr="placeholder:namePlaceholder">
        <p id="name-error" class="error" role="alert"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="langLabel"></legend>
        <div class="langs" role="radiogroup">
          <label class="lang"><input type="radio" name="lang" value="zh" checked><span>中文<small>繁體</small></span></label>
          <label class="lang"><input type="radio" name="lang" value="vi"><span>Tiếng Việt<small>Vietnamese</small></span></label>
          <label class="lang"><input type="radio" name="lang" value="en"><span>English<small>英文</small></span></label>
        </div>
      </fieldset>

      <button type="submit" class="btn" data-i18n="continue"></button>
    </form>
  </section>

  <!-- ===== 畫面 2：遊戲介紹 ===== -->
  <section id="intro-screen" class="screen card" aria-labelledby="intro-title" hidden>
    <p id="intro-title" class="welcome"></p>
    <ul class="intro-list">
      <li><span class="ico" aria-hidden="true">🎯</span><span data-i18n="intro1"></span></li>
      <li><span class="ico" aria-hidden="true">🪨</span><span data-i18n="intro2"></span></li>

      <li><span class="ico" aria-hidden="true">☁️</span><span data-i18n="intro4"></span></li>
      <li><span class="ico" aria-hidden="true">📝</span><span data-i18n="intro5"></span></li>
    </ul>
    <button id="start-game" type="button" class="btn" data-i18n="startGame"></button>
    <button id="back-btn" type="button" class="btn ghost" data-i18n="back"></button>
    </section>

  <!-- ===== 畫面 3：遊戲 ===== -->
  <section id="game-screen" class="screen card wide" hidden>
    <div class="hud"><span id="hud-name"></span><span id="hearts" role="img"></span><span id="hud-q"></span><span id="hud-score"></span></div>
    <p id="question"></p>
    <canvas id="game-canvas"></canvas>
    <div id="feedback" role="status" aria-live="polite"></div>
    <button id="next-btn" type="button" class="btn" hidden></button>
  </section>

  <!-- ===== 畫面 4：成功／失敗 ===== -->
  <section id="result-screen" class="screen card" hidden aria-live="polite">
    <p id="result-title" class="welcome"></p>
    <p id="result-detail" style="line-height:1.8;margin:0 0 18px"></p>
    <div id="save-status" role="status" aria-live="polite"></div>
    <button id="again-btn" type="button" class="btn"></button>
  </section>
</main>
<div id="damage-overlay" aria-hidden="true"></div>

/* ===== 狀態（只在遊戲結束時傳送最終成績） ===== */
const state = { lang:"zh", playerName:"", sessionId:"" };
const ANSWER_API_URL = "https://script.google.com/macros/s/AKfycbxSm19r0aIhvGh_kyeFwU5B_-aAigHJl258l2Sx9n1_5lOr9MbRZFRktiDOUsK3_I901A/exec";

const $ = s => document.querySelector(s);
const nameInput = $("#player-name"), nameError = $("#name-error");

function createSessionId(){
  if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID();
  return `game-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
}

function getDeviceType(){
  if (innerWidth < 600) return "手機";
  if (innerWidth < 1024) return "平板";
  return "電腦";
}

async function saveGameResultToGoogleSheets(result){
  const status = $("#save-status"), t = T();
  status.dataset.state = "saving";
  status.textContent = t.saving;
  const form = new URLSearchParams({
    sessionId: result.sessionId,
    playerName: result.playerName,
    totalScore: String(result.totalScore),
    answeredCount: String(result.answeredCount),
    totalQuestions: String(result.totalQuestions),
    heartsRemaining: String(result.heartsRemaining),
    gameResult: result.gameResult,
    deviceType: getDeviceType()
  });
  try {
    await fetch(ANSWER_API_URL, {method:"POST", mode:"no-cors", body:form, keepalive:true});
    if(state.sessionId !== result.sessionId) return;
    status.dataset.state = "saved";
    status.textContent = T().saved;
  } catch(error) {
    console.error("Google Sheets 最終成績傳送失敗", error);
    if(state.sessionId !== result.sessionId) return;
    status.dataset.state = "error";
    status.textContent = T().saveFailed;
  }
}

/* 套用語言到所有標記過的元素 */
function applyLanguage(lang){
  state.lang = lang;
  const t = I18N[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-attr]").forEach(el => {
    const [attr,key] = el.dataset.i18nAttr.split(":"); el.setAttribute(attr, t[key]);
  });
  if (state.playerName) $("#intro-title").textContent = t.welcome(state.playerName);
  if (nameError.dataset.key) nameError.textContent = t[nameError.dataset.key]; // 錯誤提示跟著換語言
  scheduleScreenFit();
}

/* 名稱長度：中日韓字元算 2，其他算 1，上限 24（＝12 個中文字） */
function nameWeight(s){
  let w = 0;
  for (const ch of s) w += /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]/.test(ch) ? 2 : 1;
  return w;
}
function validatePlayerName(){
  const v = nameInput.value.trim();
  let key = "";
  if (!v) key = "errEmpty"; else if (nameWeight(v) > 24) key = "errLong";
  nameError.dataset.key = key;
  nameError.textContent = key ? I18N[state.lang][key] : "";
  nameInput.setAttribute("aria-invalid", key ? "true" : "false");
  return key ? null : v;
}

let fitFrame = 0;
const reservedTextSizes = new WeakMap();
function reserveTextHeight(element,texts){
  const style = getComputedStyle(element);
  const key = [state.lang,element.clientWidth,style.font,style.lineHeight].join("|");
  if(reservedTextSizes.get(element) === key) return;
  const probe = element.cloneNode(false);
  probe.removeAttribute("role");
  probe.removeAttribute("aria-live");
  probe.setAttribute("aria-hidden","true");
  Object.assign(probe.style,{
    position:"absolute",visibility:"hidden",pointerEvents:"none",
    width:`${element.clientWidth}px`,height:"auto",minHeight:"0",margin:"0"
  });
  element.parentElement.append(probe);
  let height = 0;
  for(const text of texts){
    probe.textContent = text;
    height = Math.max(height,probe.scrollHeight);
  }
  probe.remove();
  element.style.height = `${height + 2}px`;
  reservedTextSizes.set(element,key);
}
function reserveGameMessages(){
  const t = T(), messages = [t.aim,t.miss];
  for(const q of QUESTIONS){
    messages.push(`✔ ${t.ok}　${tx(q[3])}`);
    for(const label of "ABCD"){
      messages.push(`✘ ${t.bad} ${t.right}${label}. ${tx(q[1][q[2]])}　${tx(q[3])}`);
    }
  }
  reserveTextHeight($("#feedback"),messages);
}
function scheduleScreenFit(){
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitActiveScreen);
}
function fitActiveScreen(){
  const app = $("#app"), screen = document.querySelector(".screen:not([hidden])");
  if(!app || !screen) return;
  screen.style.setProperty("--screen-scale","1");
  if(screen.id === "game-screen") reserveGameMessages();
  const cs = getComputedStyle(app);
  const availableWidth = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 18;
  const availableHeight = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 22;
  const naturalWidth = Math.max(screen.offsetWidth,screen.scrollWidth);
  const naturalHeight = Math.max(screen.offsetHeight,screen.scrollHeight);
  const scale = Math.max(.35,Math.min(1,availableWidth/naturalWidth,availableHeight/naturalHeight));
  screen.style.setProperty("--screen-scale",scale.toFixed(4));
}
function syncViewportHeight(){
  const height = globalThis.visualViewport?.height || innerHeight;
  document.documentElement.style.setProperty("--app-height",`${Math.round(height)}px`);
  scheduleScreenFit();
}

function show(id){
  document.querySelectorAll(".screen").forEach(s => { s.hidden = s.id !== id; });
  scheduleScreenFit();
}

/* 事件 */
document.querySelectorAll('input[name="lang"]').forEach(r =>
  r.addEventListener("change", () => applyLanguage(r.value)));

nameInput.addEventListener("input", () => {
  if (nameError.dataset.key) validatePlayerName();
});

$("#start-form").addEventListener("submit", e => {
  e.preventDefault();
  const v = validatePlayerName();
  if (!v){ nameInput.focus(); return; }
  state.playerName = v;
  $("#intro-title").textContent = I18N[state.lang].welcome(v); // textContent，避免注入
  show("intro-screen");
  $("#start-game").focus();
});

const HEART=["..oooo..oooo..",".orrrroorrrro.","orhhrrrrrrrrro","orhrrrrrrrrrro","orrrrrrrrrrrro","orrrrrrrrrrrro",".orrrrrrrrrro.","..orrrrrrrro..","...orrrrrro...","....orrrro....",".....orro.....","......oo......"];
const HFULL={o:"#1a1a2e",r:"#e53935",h:"#ff9a90"}, HEMPTY={o:"#1a1a2e",r:"#ffffff",h:"#ffffff"};
function sprite(rows,pal,px){ let r="";
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{ if(pal[c]) r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`; }));
  return `<svg viewBox="0 0 14 ${rows.length}" width="${14*px}" height="${rows.length*px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`; }
/* 像素雲：用圓形遮罩在 24×12 格點上點陣化，外圈描邊、底部加陰影 */
const CLOUD_COL={normal:["#ffffff","#d5dbe6"],correct:["#d4f7c5","#9fd98b"],wrong:["#ffc9c4","#e8948c"],reveal:["#e4f8d8","#b5e3a0"]}, cloudCache={};
function cloudImg(st){ if(cloudCache[st]) return cloudCache[st];
  const w=24,h=12, inC=(x,y,cx,cy,r)=>(x+.5-cx)**2+(y+.5-cy)**2<=r*r, m=[];
  for(let y=0;y<h;y++){ m[y]=[]; for(let x=0;x<w;x++) m[y][x]=inC(x,y,6.5,7.6,4.4)||inC(x,y,12.5,5.8,5.6)||inC(x,y,18.3,7.4,4.3)||(x>=3&&x<=20&&y>=7&&y<=10); }
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d"), [f,sh]=CLOUD_COL[st];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!m[y][x]) continue;
    const edge=!(m[y-1]&&m[y-1][x])||!(m[y+1]&&m[y+1][x])||!m[y][x-1]||!m[y][x+1];
    g.fillStyle=edge?"#1a1a2e":(y>=9?sh:f); g.fillRect(x,y,1,1); }
  return cloudCache[st]=c; }

/* ===== 遊戲狀態與參數 ===== */
const cv = $("#game-canvas"), ctx = cv.getContext("2d");
const MAXQ = Math.min(5,QUESTIONS.length), K = 10; // K：拉距→初速度
function pickGameQuestions(){
  const pool = [...QUESTIONS];
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool.slice(0,MAXQ);
}
const G = {i:0,questions:[],score:0,hearts:5,W:900,H:520,portrait:false,g:900,anchor:{x:0,y:0},ground:0,maxPull:126,
  r:16,stone:{x:0,y:0,vx:0,vy:0},drag:false,fly:false,locked:true,busy:false,slots:[],map:[],ended:false,token:0,shake:0};
const reduced = matchMedia("(prefers-reduced-motion:reduce)");

/* ===== 版面（RWD：直向手機／橫向） ===== */
function layout(){
  const p = innerWidth < 700, dpr = Math.min(devicePixelRatio||1,2), W=p?420:900, H=p?560:520;
  Object.assign(G,{portrait:p,W,H,g:p?450:800,maxPull:p?85:110,r:p?14:16});
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  G.ground = Math.round(H*.84);                      // 對齊背景圖的草地頂端
  G.anchor = {x:p?70:90,y:G.ground-(p?110:130)};
  /* 四朵答案雲排成一直線（一欄靠右）、互不重疊；階梯式高度讓每朵雲都有不被遮住的射擊路線 */
  const tw=p?200:210, th=100;
  const pos = p ? [[205,15],[205,125],[205,235],[205,345]] : [[660,10],[660,120],[660,230],[660,340]];
  G.slots = pos.map(([x,y],j)=>({x,y,w:tw,h:th,st:"normal",label:"ABCD"[j]}));
}
function resetStone(){ Object.assign(G.stone,{x:G.anchor.x,y:G.anchor.y,vx:0,vy:0}); G.drag=false; G.fly=false; }

/* ===== 載入題目 ===== */
function loadQuestion(i){
  G.i=i; G.token++; G.locked=false; G.busy=false;
  layout(); resetStone();
  const q=G.questions[i], shift=i%4;
  G.map=[0,1,2,3].map(j=>(j+shift)%4);               // 每題輪替正確答案位置
  G.slots.forEach((s,j)=>{ s.st="normal"; s.text=tx(q[1][G.map[j]]); });
  $("#question").textContent = tx(q[0]);
  $("#hud-q").textContent = T().qn(i+1,MAXQ);
  $("#hud-score").textContent = `${T().score} ${G.score}`;
  $("#feedback").textContent = T().aim;
  $("#next-btn").textContent = T().next;
  $("#next-btn").hidden = true;
}
function updateHearts(){
  $("#hearts").innerHTML=Array.from({length:5},(_,i)=>sprite(HEART,i<G.hearts?HFULL:HEMPTY,2)).join("");
  $("#hearts").setAttribute("aria-label",`${T().hearts} ${G.hearts}/5`);
}

/* ===== 答題（Canvas 命中與替代按鈕共用唯一入口） ===== */
function answer(slot){
  if(G.locked) return; G.locked=true; G.fly=false; G.drag=false;
  const q=G.questions[G.i], ok=G.map[slot]===q[2], correctSlot=G.map.indexOf(q[2]), t=T();
  G.slots[slot].st = ok?"correct":"wrong"; if(!ok){ G.slots[correctSlot].st="reveal"; G.shake=reduced.matches?0:18; }
  let msg = ok ? `✔ ${t.ok}` : `✘ ${t.bad} ${t.right}${G.slots[correctSlot].label}. ${G.slots[correctSlot].text}`;
  $("#feedback").textContent = `${msg}　${tx(q[3])}`;
  if(ok) G.score+=10; else { G.hearts=Math.max(0,G.hearts-1); damage(); }
  updateHearts(); $("#hud-score").textContent=`${t.score} ${G.score}`;
  if(G.hearts<=0){ G.ended=true; const tk=G.token; setTimeout(()=>{ if(tk===G.token) showResult(false); },1200); return; }
  const nb=$("#next-btn"); nb.textContent=t.next; nb.hidden=false; nb.focus();
}
function damage(){
  const o=$("#damage-overlay"), g=$("#game-screen");
  o.classList.remove("is-active"); g.classList.remove("is-hit"); void o.offsetWidth;
  o.classList.add("is-active"); g.classList.add("is-hit");
  setTimeout(()=>{ o.classList.remove("is-active"); g.classList.remove("is-hit"); }, reduced.matches?500:650); }
$("#next-btn").addEventListener("click",()=>{
  if(G.busy||G.ended) return; G.busy=true;
  G.i+1>=MAXQ ? showResult(true) : loadQuestion(G.i+1);
});
function showResult(win){
  if(G.resultSubmitted) return;
  G.ended=true;
  G.resultSubmitted=true;
  G.token++; const t=T();
  $("#result-title").textContent = `${state.playerName}　${win?t.win:t.lose}`;
  const answered = win?MAXQ:G.i+1;
  $("#result-detail").textContent = `${t.score}：${G.score} / ${MAXQ*10}\n${t.done}：${answered} / ${MAXQ}\n${t.left}：${G.hearts}`;
  $("#result-detail").style.whiteSpace="pre-line";
  $("#again-btn").textContent = win?t.again:t.retry;
  show("result-screen"); $("#again-btn").focus();
  reserveTextHeight($("#save-status"),[t.saving,t.saved,t.saveFailed]);
  saveGameResultToGoogleSheets({
    sessionId:state.sessionId,playerName:state.playerName,totalScore:G.score,
    answeredCount:answered,totalQuestions:MAXQ,heartsRemaining:G.hearts,
    gameResult:win?"成功":"失敗"
  });
}
$("#again-btn").addEventListener("click",()=>{ state.playerName=""; nameInput.value=""; nameError.dataset.key=""; nameError.textContent="";
  G.ended=true; show("name-screen"); nameInput.focus(); });

/* ===== 彈弓拖曳（Pointer Events） ===== */
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*G.W/r.width, y:(e.clientY-r.top)*G.H/r.height}; }
cv.addEventListener("pointerdown",e=>{
  if(G.locked||G.fly||G.busy) return; const p=pt(e), s=G.stone;
  if(Math.hypot(p.x-s.x,p.y-s.y) < G.r+(e.pointerType==="touch"?30:15)){ G.drag=true; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("pointermove",e=>{
  if(!G.drag) return; const p=pt(e);
  let dx=p.x-G.anchor.x, dy=Math.max(0,p.y-G.anchor.y), d=Math.hypot(dx,dy);
  if(d>G.maxPull){ dx=dx/d*G.maxPull; dy=dy/d*G.maxPull; }
  G.stone.x=G.anchor.x+dx; G.stone.y=G.anchor.y+dy;
});
cv.addEventListener("pointerup",()=>{
  if(!G.drag) return; G.drag=false; const s=G.stone, pull=Math.hypot(G.anchor.x-s.x,G.anchor.y-s.y);
  if(pull<12){ resetStone(); return; }   // 拉太短視為取消
  s.vx=(G.anchor.x-s.x)*K; s.vy=(G.anchor.y-s.y)*K; G.fly=true;
});
cv.addEventListener("pointercancel",()=>{ if(G.drag) resetStone(); });

/* ===== 物理與碰撞 ===== */
function hitTest(){ const s=G.stone;
  for(let j=0;j<4;j++){ const t=G.slots[j], cx=Math.max(t.x+8,Math.min(s.x,t.x+t.w-8)), cy=Math.max(t.y+6,Math.min(s.y,t.y+t.h-6));
    if(Math.hypot(s.x-cx,s.y-cy)<=G.r) return j; } return -1; }
function update(dt){
  if(!G.fly) return; const s=G.stone;
  for(let k=0;k<2;k++){ s.vy+=G.g*dt/2; s.x+=s.vx*dt/2; s.y+=s.vy*dt/2;
    const h=hitTest(); if(h>=0){ answer(h); return; } }
  if(s.x>G.W+40||s.x<-40||(s.y>G.ground&&s.vy>0)){            // 未擊中：不扣分，稍後重置
    G.fly=false; G.busy=true; $("#feedback").textContent=T().miss; const tk=G.token;
    setTimeout(()=>{ if(tk===G.token&&!G.locked){ resetStone(); G.busy=false; } },600);
  }
}

/* ===== 繪製（不修改遊戲狀態） ===== */
function wrap(t,mw){ const sp=/\s/.test(t), w=sp?t.split(" "):[...t], L=[]; let c="";
  for(const x of w){ const n=c?c+(sp?" ":"")+x:x; if(ctx.measureText(n).width>mw&&c){L.push(c);c=x}else c=n } L.push(c); return L; }
function draw(){
  const {W,H,anchor:a,ground:gr,stone:s}=G;
  ctx.imageSmoothingEnabled=false;
  if(BG.complete&&BG.width){ { const sw=BG.height*W/H; ctx.drawImage(BG,G.portrait?110:(BG.width-sw)/2,0,sw,BG.height,0,0,W,H); } }
  else { ctx.fillStyle="#4a9df5"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#8fd14f"; ctx.fillRect(0,gr,W,H-gr); }
  // 彈弓
  ctx.lineCap="round"; ctx.strokeStyle="#5e3a18"; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(a.x,gr+6); ctx.lineTo(a.x,a.y+34); ctx.stroke();
  ctx.strokeStyle="#8a5a2b"; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(a.x,a.y+34); ctx.quadraticCurveTo(a.x-4,a.y+10,a.x-20,a.y-26); ctx.moveTo(a.x,a.y+34); ctx.quadraticCurveTo(a.x+4,a.y+10,a.x+20,a.y-26); ctx.stroke();
  if(!G.fly&&!G.busy&&!G.locked||G.drag){ ctx.strokeStyle="#3f2a14"; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(a.x-20,a.y-26); ctx.lineTo(s.x,s.y); ctx.lineTo(a.x+20,a.y-26); ctx.stroke(); }
  // 預測軌跡
  if(G.drag){ let x=s.x,y=s.y,vx=(a.x-s.x)*K,vy=(a.y-s.y)*K;
    for(let i=0;i<12;i++){ for(let k=0;k<4;k++){ vy+=G.g*.015; x+=vx*.015; y+=vy*.015; }
      ctx.fillStyle=`rgba(255,255,255,${.9-i*.065})`; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); } }
  // 答案目標（像素雲）
  G.slots.forEach(t=>{
    const sx=t.st==="wrong"&&G.shake?Math.sin(performance.now()/30)*G.shake*.3:0, x=t.x+sx;
    ctx.drawImage(cloudImg(t.st),x,t.y,t.w,t.h);
    const mark={correct:"✔",wrong:"✘",reveal:"✔"}[t.st];
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if(mark){ ctx.fillStyle=t.st==="wrong"?"#b3261e":"#2e8b2e"; ctx.font="900 26px sans-serif"; ctx.fillText(mark,x+t.w/2,t.y+t.h*.27); }
    const label=`${t.label}. ${t.text}`, bw=t.w*.74, bh=t.h*.44; let fs=Math.round(t.h*.15), L;
    const fam='"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans",sans-serif';
    do{ ctx.font=`800 ${fs}px ${fam}`; L=wrap(label,bw); fs--; } while(L.length*(fs+1)*1.2>bh&&fs>9);
    ctx.fillStyle="#1a1a2e"; const lh=(fs+1)*1.2, y0=t.y+t.h*.42+(bh-L.length*lh)/2+lh/2;
    L.forEach((l,i)=>ctx.fillText(l,x+t.w/2,y0+i*lh));
  });
  // 石頭
  if(!(G.busy&&!G.locked&&!G.fly&&false)){ ctx.fillStyle="#3c4046"; ctx.beginPath(); ctx.arc(s.x,s.y,G.r,0,7); ctx.fill();
    ctx.fillStyle="#6b7280"; ctx.beginPath(); ctx.arc(s.x-G.r*.3,s.y-G.r*.3,G.r*.3,0,7); ctx.fill(); }
}

/* ===== 主迴圈（dt 上限 0.033，避免切分頁後瞬間飛走） ===== */
let lastT=0;
function loop(t){ const dt=Math.min(.033,(t-lastT)/1000||0); lastT=t;
  if(!$("#game-screen").hidden){ update(dt); draw(); G.shake*=.92; } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
addEventListener("resize",()=>{
  syncViewportHeight();
  if(!$("#game-screen").hidden&&!G.ended){ layout();
    G.questions.length&&G.slots.forEach((s,j)=>{ s.text=tx(G.questions[G.i][1][G.map[j]]); }); resetStone(); }
});
if(globalThis.visualViewport) visualViewport.addEventListener("resize",syncViewportHeight);
if(globalThis.ResizeObserver){
  const screenObserver = new ResizeObserver(scheduleScreenFit);
  document.querySelectorAll(".screen").forEach(screen=>screenObserver.observe(screen));
}

/* ===== 開始／返回 ===== */
function startGame(){
  Object.assign(G,{questions:pickGameQuestions(),score:0,hearts:5,ended:false,resultSubmitted:false}); G.token++;
  state.sessionId=createSessionId();
  $("#save-status").textContent=""; $("#save-status").dataset.state="";
  $("#hud-name").textContent=state.playerName; updateHearts();
  show("game-screen"); loadQuestion(0);
}
$("#back-btn").addEventListener("click",()=>{ show("name-screen"); nameInput.focus(); });
$("#start-game").addEventListener("click",startGame);

syncViewportHeight();
applyLanguage("zh");
nameInput.focus();
</script>
